<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Güvenli Dosya Merkezi</title>
    
    <!-- Kütüphaneler -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body { background-color: #020617; margin: 0; overflow: hidden; -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, sans-serif; }
        .no-select { user-select: none; -webkit-user-select: none; }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        #root:empty { display: flex; align-items: center; justify-content: center; height: 100vh; color: #6366f1; font-weight: bold; }
        
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .toast-active { transform: translateY(0); opacity: 1; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .progress-ring__circle { transition: stroke-dashoffset 0.3s ease-in-out; transform: rotate(-90deg); transform-origin: 50% 50%; }
        
        /* Şık Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 6px; }
    </style>
</head>
<body>
    <div id="root">SİSTEM BAŞLATILIYOR...</div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (window.lucide && containerRef.current) {
                    containerRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
                    window.lucide.createIcons({ attrs: { width: size, height: size, class: className, 'stroke-width': 2 } });
                }
            }, [name, size, className]);
            return <span ref={containerRef} className={`inline-flex items-center justify-center ${className}`} style={{ width: size, height: size }} />;
        };

        const formatBytes = (bytes) => {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        };

        const App = () => {
            const [myId, setMyId] = useState('');
            const [remoteId, setRemoteId] = useState('');
            const [peer, setPeer] = useState(null);
            const [connection, setConnection] = useState(null);
            
            const [transferStatus, setTransferStatus] = useState('idle');
            const [transferProgress, setTransferProgress] = useState(0);
            const [receivedFile, setReceivedFile] = useState(null);
            const [sentFileName, setSentFileName] = useState('');
            const [incomingOffer, setIncomingOffer] = useState(null);
            
            const [showQr, setShowQr] = useState(false);
            const [pairedDevices, setPairedDevices] = useState([]);
            const [toast, setToast] = useState({ show: false, message: '' });
            
            const fileInputRef = useRef(null);
            const qrRef = useRef(null);
            const chunkBuffers = useRef({});
            const activeConnRef = useRef(null);
            const pendingFileRef = useRef(null);

            const getShareUrl = () => {
                return `https://gokhangeo.github.io/hub/?join=${myId}`;
            };

            const showToast = (msg) => {
                setToast({ show: true, message: msg });
                setTimeout(() => setToast({ show: false, message: '' }), 3000);
            };

            const setupConnection = (conn) => {
                if (!conn) return;
                if (activeConnRef.current && activeConnRef.current.peer === conn.peer && activeConnRef.current.open) return;

                conn.on('open', () => {
                    if (activeConnRef.current && activeConnRef.current.open && activeConnRef.current.peer === conn.peer) {
                        conn.close();
                        return;
                    }
                    activeConnRef.current = conn;
                    setConnection(conn);
                    setTransferStatus('connected');
                    setRemoteId(conn.peer);
                    showToast("Güvenli Bağlantı Kuruldu!");
                    setShowQr(false);
                    
                    setPairedDevices(prev => {
                        const updated = [conn.peer, ...prev.filter(id => id !== conn.peer)].slice(0, 5);
                        localStorage.setItem('hub_paired_devices', JSON.stringify(updated));
                        return updated;
                    });
                });

                conn.on('data', (data) => {
                    if (data.type === 'file-offer') {
                        setIncomingOffer({ fileId: data.fileId, fileName: data.fileName, fileSize: data.fileSize, fileType: data.fileType });
                        setTransferStatus('receiving_offer');
                        showToast("Dosya İsteği Geldi");
                        if (navigator.vibrate) navigator.vibrate(200);
                    } else if (data.type === 'file-accept') {
                        const pending = pendingFileRef.current;
                        if (pending && pending.fileId === data.fileId) {
                            startChunking(pending.file, data.fileId);
                        } else {
                            showToast("Dosya bulunamadı, iptal edildi.");
                            setTransferStatus('connected');
                        }
                    } else if (data.type === 'file-reject') {
                        setTransferStatus('connected');
                        pendingFileRef.current = null;
                        showToast("Karşı taraf dosyayı reddetti.");
                    } else if (data.type === 'file-chunk') {
                        const { fileId, fileName, fileType, chunk, totalChunks, currentChunk } = data;
                        if (!chunkBuffers.current[fileId]) { 
                            chunkBuffers.current[fileId] = []; 
                            setTransferStatus('receiving'); 
                            setReceivedFile(null);
                        }
                        chunkBuffers.current[fileId][currentChunk] = chunk;
                        
                        // %0'da donmayı önlemek için arayüzü her 20 parçada bir güncelle (Performans)
                        if (currentChunk % 20 === 0 || currentChunk === totalChunks - 1) {
                            setTransferProgress(Math.round(((currentChunk + 1) / totalChunks) * 100));
                        }
                        
                        if (chunkBuffers.current[fileId].length === totalChunks) {
                            const blob = new Blob(chunkBuffers.current[fileId], { type: fileType });
                            setReceivedFile({ url: URL.createObjectURL(blob), name: fileName, type: fileType });
                            setTransferStatus('completed');
                            setIncomingOffer(null);
                            delete chunkBuffers.current[fileId];
                            conn.send({ type: 'file-delivered', fileId });
                            if (navigator.vibrate) navigator.vibrate(200);
                            showToast("Dosya Alındı!");
                        }
                    } else if (data.type === 'file-delivered') {
                        setTransferStatus('delivered');
                        pendingFileRef.current = null;
                        showToast("Teslimat Başarılı!");
                    }
                });
                
                conn.on('close', () => { 
                    if (activeConnRef.current === conn) {
                        activeConnRef.current = null;
                        setConnection(null); 
                        setTransferStatus('idle'); 
                        showToast("Bağlantı Kesildi");
                    }
                });
            };

            useEffect(() => {
                let savedId = localStorage.getItem('hub_my_id');
                if (!savedId) {
                    savedId = "OP-" + Math.random().toString(36).substring(2, 6).toUpperCase();
                    localStorage.setItem('hub_my_id', savedId);
                }
                setMyId(savedId);
                setPairedDevices(JSON.parse(localStorage.getItem('hub_paired_devices') || '[]'));

                const newPeer = new window.Peer(savedId, { config: { 'iceServers': [{ url: 'stun:stun.l.google.com:19302' }] } });
                newPeer.on('open', () => {
                    setPeer(newPeer);
                    const urlParams = new URLSearchParams(window.location.search);
                    const joinId = urlParams.get('join');
                    if (joinId && joinId !== savedId) {
                        setTimeout(() => { if (!activeConnRef.current) setupConnection(newPeer.connect(joinId, { reliable: true })); }, 500);
                    }
                });
                newPeer.on('connection', (conn) => setupConnection(conn));
                return () => { if (newPeer) newPeer.destroy(); };
            }, []);

            const connectToPeer = (id) => {
                const target = id || remoteId;
                if (!target || !peer) return;
                setTransferStatus('connecting');
                setupConnection(peer.connect(target, { reliable: true }));
            };

            const copyToClipboard = (text) => {
                navigator.clipboard.writeText(text).then(() => showToast("Bağlantı Kopyalandı!")).catch(() => {
                    const input = document.createElement('input');
                    input.value = text; document.body.appendChild(input);
                    input.select(); document.execCommand('copy'); document.body.removeChild(input);
                    showToast("Bağlantı Kopyalandı!");
                });
            };

            const shareLink = async () => {
                const shareUrl = getShareUrl();
                if (navigator.share && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
                    try { await navigator.share({ title: 'Güvenli Bağlantı', url: shareUrl }); } catch (err) { copyToClipboard(shareUrl); }
                } else { copyToClipboard(shareUrl); }
            };

            const handleFileSelect = (e) => {
                const file = e.target.files[0]; 
                if (!file || !connection) return;
                
                const fileId = Math.random().toString(36).substring(7);
                setSentFileName(file.name);
                pendingFileRef.current = { file, fileId }; 
                
                setTransferStatus('pending_approval');
                connection.send({
                    type: 'file-offer', fileId: fileId, fileName: file.name, fileSize: file.size, fileType: file.type
                });
                
                if(fileInputRef.current) fileInputRef.current.value = '';
            };

            const startChunking = async (file, fileId) => {
                setTransferStatus('sending');
                setTransferProgress(0);
                
                // %0'da Kalma Çözümü: WebRTC kanalları büyük paketleri düşürür. 32KB garanti teslimattır.
                const chunkSize = 32 * 1024; 
                const totalChunks = Math.ceil(file.size / chunkSize);
                
                for (let i = 0; i < totalChunks; i++) {
                    if (!activeConnRef.current || !activeConnRef.current.open) {
                        showToast("Bağlantı koptu!");
                        setTransferStatus('connected');
                        break;
                    }
                    const start = i * chunkSize;
                    const chunk = file.slice(start, Math.min(file.size, start + chunkSize));
                    const buffer = await chunk.arrayBuffer();

                    activeConnRef.current.send({ 
                        type: 'file-chunk', fileId, fileName: file.name, fileType: file.type, 
                        chunk: buffer, totalChunks, currentChunk: i 
                    });
                    
                    // UI'ı yormamak için her 20 pakette bir güncelleme
                    if (i % 20 === 0 || i === totalChunks - 1) {
                        setTransferProgress(Math.round(((i + 1) / totalChunks) * 100));
                    }
                    
                    // Ağın tıkanmaması için mini mola
                    await new Promise(r => setTimeout(r, 2)); 
                }
            };

            const acceptFile = () => {
                if (!connection || !incomingOffer) return;
                connection.send({ type: 'file-accept', fileId: incomingOffer.fileId });
                setTransferStatus('receiving');
                showToast("Aktarım Başlıyor...");
            };

            const rejectFile = () => {
                if (!connection || !incomingOffer) return;
                connection.send({ type: 'file-reject', fileId: incomingOffer.fileId });
                setIncomingOffer(null);
                setTransferStatus('connected');
                showToast("Dosya Reddedildi.");
            };

            const disconnect = () => {
                if (connection) {
                    connection.close();
                }
                setTransferStatus('idle');
                setConnection(null);
                setReceivedFile(null);
                setIncomingOffer(null);
            }

            useEffect(() => {
                if (myId && showQr && qrRef.current) {
                    qrRef.current.innerHTML = "";
                    new window.QRCode(qrRef.current, { 
                        text: getShareUrl(), 
                        width: 220, 
                        height: 220,
                        colorDark: "#020617",
                        colorLight: "#ffffff",
                        correctLevel: window.QRCode.CorrectLevel.H
                    });
                }
            }, [myId, showQr]);

            return (
                <div className="h-screen w-screen flex items-center justify-center bg-slate-950 font-sans no-select overflow-hidden text-slate-100">
                    <div className="w-full max-w-md bg-slate-900 h-full md:h-[90vh] md:rounded-[2.5rem] flex flex-col relative border border-slate-800 shadow-2xl">
                        
                        {/* Header */}
                        <div className="p-6 pb-6 shrink-0 z-10 relative">
                            <div className="absolute inset-0 bg-gradient-to-b from-indigo-900/10 to-transparent opacity-50"></div>
                            <div className="flex justify-between items-center mb-6 relative">
                                <div className="flex items-center gap-3">
                                    <div className={`w-3 h-3 rounded-full ${connection ? 'bg-green-500 shadow-[0_0_12px_rgba(34,197,94,0.6)]' : 'bg-slate-600'}`}></div>
                                    <div>
                                        <h1 className="text-sm font-black text-white tracking-widest uppercase">Dosya Merkezi</h1>
                                        <p className="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">{connection ? 'Güvenli Hat Açık' : 'Bağlantı Yok'}</p>
                                    </div>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={shareLink} className="p-2.5 bg-slate-800/80 text-indigo-400 rounded-xl hover:bg-slate-700 transition-colors border border-slate-700/50"><Icon name="share-2" size={18} /></button>
                                    <button onClick={() => setShowQr(true)} className="p-2.5 bg-indigo-600 text-white rounded-xl shadow-lg hover:bg-indigo-500 transition-colors"><Icon name="qr-code" size={18} /></button>
                                </div>
                            </div>
                            
                            {!connection && (
                                <div className="bg-slate-950/80 p-5 rounded-2xl flex items-center justify-between border border-slate-800/80 shadow-inner relative">
                                    <div>
                                        <p className="text-[9px] text-slate-500 font-bold uppercase tracking-widest mb-1">Cihaz Kimliğiniz</p>
                                        <p className="text-2xl font-mono font-black text-indigo-400 tracking-tight">{myId || "..."}</p>
                                    </div>
                                    <button onClick={() => copyToClipboard(myId)} className="text-slate-400 p-3 bg-slate-900/80 rounded-xl hover:text-white transition-colors border border-slate-800"><Icon name="copy" size={20} /></button>
                                </div>
                            )}
                            
                            {connection && (
                                <div className="bg-green-500/10 border border-green-500/20 p-4 rounded-2xl flex items-center justify-between shadow-inner relative">
                                    <div className="flex items-center gap-3">
                                        <div className="p-2 bg-green-500/20 rounded-lg"><Icon name="shield-check" size={18} className="text-green-500" /></div>
                                        <div>
                                            <p className="text-[9px] text-green-500/70 font-bold uppercase tracking-widest mb-1">Bağlı Cihaz</p>
                                            <p className="text-base font-mono font-black text-green-400 tracking-tight">{connection.peer}</p>
                                        </div>
                                    </div>
                                    <button onClick={disconnect} className="text-red-400 p-2 bg-red-500/10 rounded-xl hover:bg-red-500/20 hover:text-red-300 transition-colors border border-red-500/20"><Icon name="power" size={18} /></button>
                                </div>
                            )}
                        </div>

                        {/* İçerik */}
                        <div className="flex-1 relative bg-slate-900/40 flex flex-col px-6 pb-6">
                            
                            {/* QR Kod Modal */}
                            {showQr && (
                                <div className="absolute inset-0 z-50 bg-slate-950/95 backdrop-blur-sm flex items-center justify-center p-6 fade-in">
                                    <div className="bg-white p-8 rounded-[2rem] flex flex-col items-center w-full max-w-[320px] shadow-2xl">
                                        <div className="w-full flex justify-between items-center mb-8">
                                            <span className="text-slate-900 font-black text-sm uppercase tracking-widest">Sistemi Eşleştir</span>
                                            <button onClick={()=>setShowQr(false)} className="text-slate-400 hover:text-slate-900 transition-colors"><Icon name="x" size={24}/></button>
                                        </div>
                                        <div ref={qrRef} className="flex justify-center mb-8 p-4 bg-slate-50 rounded-2xl border border-slate-200"></div>
                                        <p className="text-[10px] text-slate-500 font-bold mb-6 tracking-widest text-center uppercase">Kamerayı koda doğrultun</p>
                                        <button onClick={shareLink} className="w-full bg-indigo-600 text-white py-4 rounded-xl font-black text-xs uppercase shadow-lg shadow-indigo-600/30 hover:bg-indigo-700 transition-colors mb-3">Bağlantı Gönder</button>
                                        <button onClick={()=>setShowQr(false)} className="w-full bg-slate-100 text-slate-600 py-3.5 rounded-xl font-bold text-xs uppercase hover:bg-slate-200 transition-colors">Kapat</button>
                                    </div>
                                </div>
                            )}

                            {/* BAĞLANTI BEKLENİYOR */}
                            {!connection && transferStatus !== 'connecting' && (
                                <div className="flex-1 flex flex-col h-full fade-in pt-4">
                                    <div className="w-full space-y-3 mb-8">
                                        <div className="relative">
                                            <input value={remoteId} onChange={(e)=>setRemoteId(e.target.value.toUpperCase())} placeholder="HEDEF KODU GİRİN" className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-5 pl-14 text-left font-mono font-black text-lg text-white outline-none focus:border-indigo-500 transition-colors placeholder:text-slate-700 shadow-inner" />
                                            <Icon name="link" size={20} className="absolute left-5 top-1/2 transform -translate-y-1/2 text-slate-600" />
                                        </div>
                                        <button onClick={() => connectToPeer(remoteId)} className="w-full bg-indigo-600 py-5 rounded-2xl font-black text-sm text-white uppercase tracking-widest shadow-xl shadow-indigo-600/20 hover:bg-indigo-500 active:scale-95 transition-all">Sisteme Bağlan</button>
                                    </div>
                                    
                                    {pairedDevices.length > 0 && (
                                        <div className="w-full flex-1 overflow-y-auto pb-4">
                                            <p className="text-[10px] font-black text-slate-600 uppercase mb-4 tracking-[0.2em] px-2">Hızlı Erişim</p>
                                            <div className="space-y-2 pr-1">
                                                {pairedDevices.map(id => (
                                                    <button key={id} onClick={() => connectToPeer(id)} className="w-full flex justify-between items-center bg-slate-900/80 p-4 rounded-2xl border border-slate-800/80 hover:border-indigo-500 transition-colors group shadow-sm">
                                                        <div className="flex items-center gap-3">
                                                            <div className="p-2 bg-slate-800 rounded-lg group-hover:bg-indigo-500/20 transition-colors"><Icon name="monitor-smartphone" size={16} className="text-slate-500 group-hover:text-indigo-400" /></div>
                                                            <span className="font-mono font-bold text-slate-400 group-hover:text-indigo-400">{id}</span>
                                                        </div>
                                                        <Icon name="chevron-right" size={18} className="text-slate-600 group-hover:text-indigo-500" />
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* BAĞLANIYOR */}
                            {transferStatus === 'connecting' && (
                                <div className="flex-1 flex flex-col items-center justify-center space-y-5 fade-in">
                                    <div className="w-12 h-12 border-4 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin"></div>
                                    <p className="text-xs text-indigo-400 font-black uppercase tracking-[0.2em]">Bağlantı Kuruluyor...</p>
                                </div>
                            )}
                            
                            {/* DOSYA TRANSFER ALANI */}
                            {connection && (
                                <div className="flex-1 flex flex-col fade-in">
                                    <div className="flex-1 flex flex-col justify-center">
                                        <div className="bg-slate-950/60 border border-slate-800 rounded-[2.5rem] p-8 text-center shadow-2xl relative overflow-hidden flex flex-col items-center justify-center min-h-[360px]">
                                            
                                            {/* ONAY BEKLENİYOR */}
                                            {transferStatus === 'pending_approval' ? (
                                                <div className="space-y-6 fade-in w-full">
                                                    <div className="w-24 h-24 bg-amber-500/10 rounded-[2rem] flex items-center justify-center mx-auto border border-amber-500/20">
                                                        <Icon name="clock" size={40} className="text-amber-500 animate-pulse" />
                                                    </div>
                                                    <div>
                                                        <p className="font-black text-xs text-white uppercase tracking-widest mb-3">Onay Bekleniyor</p>
                                                        <p className="text-slate-400 text-[11px] truncate px-4 bg-slate-900 py-3 rounded-xl border border-slate-800">{sentFileName}</p>
                                                    </div>
                                                    <button onClick={() => {setTransferStatus('connected'); pendingFileRef.current = null; connection.send({type: 'file-reject', fileId: pendingFileRef.current?.fileId});}} className="px-8 py-3 bg-red-500/10 text-red-500 rounded-xl text-[10px] font-black uppercase hover:bg-red-500/20 transition-colors mt-4">İptal Et</button>
                                                </div>
                                            ) : 
                                            
                                            /* GELEN TEKLİF */
                                            transferStatus === 'receiving_offer' && incomingOffer ? (
                                                <div className="space-y-6 fade-in w-full">
                                                    <div className="w-24 h-24 bg-indigo-500/10 rounded-[2rem] flex items-center justify-center mx-auto border border-indigo-500/20">
                                                        <Icon name="file-question" size={40} className="text-indigo-400" />
                                                    </div>
                                                    <div>
                                                        <p className="font-black text-white text-sm mb-3 uppercase tracking-widest">Gelen Dosya Var</p>
                                                        <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                                                            <p className="text-xs text-slate-300 truncate font-medium">{incomingOffer.fileName}</p>
                                                            <p className="text-[10px] font-black text-indigo-400 mt-2 bg-indigo-500/10 inline-block px-3 py-1 rounded-md">{formatBytes(incomingOffer.fileSize)}</p>
                                                        </div>
                                                    </div>
                                                    <div className="flex gap-3 w-full mt-4">
                                                        <button onClick={rejectFile} className="flex-1 bg-slate-800 text-slate-300 py-4 rounded-xl font-black text-xs uppercase hover:bg-slate-700 transition-colors">Reddet</button>
                                                        <button onClick={acceptFile} className="flex-1 bg-indigo-600 text-white py-4 rounded-xl font-black text-xs uppercase shadow-lg shadow-indigo-600/30 hover:bg-indigo-500 transition-colors">Kabul Et</button>
                                                    </div>
                                                </div>
                                            ) :

                                            /* AKTARIM DURUMLARI */
                                            (transferStatus === 'sending' || transferStatus === 'receiving') ? (
                                                <div className="space-y-8 fade-in w-full flex flex-col items-center">
                                                    <div className="relative w-36 h-36 flex items-center justify-center">
                                                        <svg className="w-full h-full transform -rotate-90 absolute inset-0">
                                                            <circle cx="72" cy="72" r="66" stroke="currentColor" strokeWidth="8" fill="transparent" className="text-slate-800" />
                                                            <circle cx="72" cy="72" r="66" stroke="currentColor" strokeWidth="8" fill="transparent" strokeDasharray="414" strokeDashoffset={414 - (414 * transferProgress) / 100} className="progress-ring__circle text-indigo-500" />
                                                        </svg>
                                                        <div className="text-4xl font-black text-white">{transferProgress}</div>
                                                        <span className="absolute bottom-6 text-[8px] font-bold text-slate-400">%</span>
                                                    </div>
                                                    <p className="text-xs font-black text-indigo-400 animate-pulse uppercase tracking-[0.3em]">
                                                        {transferStatus === 'sending' ? 'GÖNDERİLİYOR...' : 'ALINIYOR...'}
                                                    </p>
                                                </div>
                                            ) : 
                                            
                                            /* TESLİM EDİLDİ */
                                            transferStatus === 'delivered' ? (
                                                <div className="space-y-6 fade-in w-full">
                                                    <div className="w-24 h-24 bg-green-500/10 rounded-[2rem] flex items-center justify-center mx-auto border border-green-500/20">
                                                        <Icon name="check" size={48} className="text-green-500" />
                                                    </div>
                                                    <div>
                                                        <p className="text-xs text-green-400 font-black uppercase tracking-widest mb-3">Teslimat Başarılı</p>
                                                        <p className="font-bold text-sm text-white truncate px-4 bg-slate-900 py-4 rounded-xl border border-slate-800">{sentFileName}</p>
                                                    </div>
                                                    <button onClick={() => {setTransferStatus('connected'); setReceivedFile(null);}} className="mt-4 px-10 py-3.5 bg-slate-800 text-white rounded-xl text-xs font-black uppercase hover:bg-slate-700 transition-colors">Tamam</button>
                                                </div>
                                            ) : 
                                            
                                            /* DOSYA ALINDI */
                                            receivedFile ? (
                                                <div className="space-y-6 fade-in w-full">
                                                    {receivedFile.type.startsWith('image/') ? (
                                                        <div className="w-full h-44 rounded-2xl overflow-hidden border border-slate-700 mb-4 bg-slate-900 relative">
                                                            <img src={receivedFile.url} className="w-full h-full object-cover opacity-90" />
                                                        </div>
                                                    ) : receivedFile.type.startsWith('video/') ? (
                                                        <div className="w-full h-44 rounded-2xl overflow-hidden border border-slate-700 mb-4 bg-slate-900">
                                                            <video src={receivedFile.url} controls className="w-full h-full object-cover" />
                                                        </div>
                                                    ) : (
                                                        <div className="w-24 h-24 bg-indigo-500/10 rounded-[2rem] flex items-center justify-center mx-auto border border-indigo-500/20 mb-4">
                                                            <Icon name="file-check" size={40} className="text-indigo-400" />
                                                        </div>
                                                    )}
                                                    
                                                    <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 mb-6">
                                                        <p className="font-bold text-sm text-white truncate">{receivedFile.name}</p>
                                                    </div>
                                                    
                                                    <div className="flex gap-3">
                                                        <button onClick={() => {setReceivedFile(null); setTransferStatus('connected');}} className="flex-1 bg-slate-800 text-slate-300 py-4 rounded-xl font-black text-xs uppercase hover:bg-slate-700 transition-colors">Kapat</button>
                                                        <a href={receivedFile.url} download={receivedFile.name} className="flex-1 flex items-center justify-center gap-2 bg-green-600 text-white py-4 rounded-xl font-black text-xs uppercase shadow-lg shadow-green-600/30 hover:bg-green-500 transition-colors">
                                                            <Icon name="download" size={18} /> Kaydet
                                                        </a>
                                                    </div>
                                                </div>
                                            ) : 
                                            
                                            /* BOŞ DURUM - DOSYA SEÇ */
                                            (
                                                <div className="space-y-8 w-full fade-in">
                                                    <div className="w-32 h-32 bg-slate-900 rounded-[2.5rem] flex items-center justify-center mx-auto border border-slate-800 group hover:border-indigo-500 hover:bg-slate-800/80 transition-all cursor-pointer shadow-lg" onClick={() => fileInputRef.current.click()}>
                                                        <Icon name="upload-cloud" size={48} className="text-slate-500 group-hover:text-indigo-400 transition-colors" />
                                                    </div>
                                                    <div>
                                                        <h3 className="font-black text-white uppercase text-sm tracking-widest mb-2">Dosya Gönder</h3>
                                                        <p className="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Fotoğraf, Video veya Belge</p>
                                                    </div>
                                                    <input type="file" onChange={handleFileSelect} className="hidden" ref={fileInputRef} accept="*/*, .pdf, .doc, .docx, .xls, .xlsx, .zip, .rar, .txt, .mp4, .mov, .avi" />
                                                    <button onClick={() => fileInputRef.current.click()} className="w-full bg-indigo-600 py-4 rounded-2xl font-black text-xs text-white uppercase shadow-xl shadow-indigo-600/20 hover:bg-indigo-500 active:scale-95 transition-all tracking-widest">Dosya Seç</button>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Alt Bilgi */}
                        <div className="p-5 bg-slate-950 flex justify-between items-center border-t border-slate-800 shrink-0 safe-bottom">
                            <span className="text-[9px] font-black text-slate-600 uppercase tracking-widest">Sistem v7.4 Pro</span>
                            <span className="text-[9px] font-bold text-slate-600">© Gökhan ELGÜL tarafından tasarlanmıştır.</span>
                        </div>

                        {/* Toast Bildirimler */}
                        {toast.show && (
                            <div className="absolute bottom-20 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full text-[10px] font-black uppercase shadow-2xl border border-slate-700 z-[100] toast-active flex items-center gap-2 whitespace-nowrap">
                                <Icon name="info" size={14} className="text-indigo-400" />
                                {toast.message}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
